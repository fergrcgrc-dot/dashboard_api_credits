<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crédito de APIs</title>
<style>
/* Sistema visual: plantilla "The Barely-There UI" de designmd.app.
   Una sola familia tipográfica en pesos finos, jerarquía por opacidad de la tinta,
   líneas de 1px, esquinas rectas, sin sombras ni degradados. Tres colores: fondo,
   tinta y un único color de alerta. Reglas completas en DESIGN.md. */
:root{
  --fondo:#ffffff; --tinta:0 0 0; --alerta:#b42318;
  --t1:rgb(var(--tinta)); --t2:rgb(var(--tinta)/.78); --t3:rgb(var(--tinta)/.56);
  --linea:rgb(var(--tinta)/.12); --linea-fuerte:rgb(var(--tinta)/.32); --velo:rgb(var(--tinta)/.04);
  --barra:rgb(var(--tinta)/.82); --barra-cero:rgb(var(--tinta)/.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--fondo:#0b0b0b; --tinta:255 255 255; --alerta:#ff8a7a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--t2);
  font:400 15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1080px;margin:0 auto;padding:56px 24px 120px}
a{color:var(--t1);text-underline-offset:3px;text-decoration-color:var(--linea-fuerte)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:1px solid var(--t1);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:56px}
h1{margin:0;font-size:1rem;font-weight:500;color:var(--t1);letter-spacing:0}
.meta{display:flex;align-items:baseline;gap:16px;font-size:.87rem;color:var(--t3)}
button{font:inherit;font-size:.87rem;color:var(--t1);background:none;border:0;border-bottom:1px solid var(--linea-fuerte);padding:2px 0;cursor:pointer;transition:border-color .3s ease-out}
button:hover{border-bottom-color:var(--t1)}
button:disabled{color:var(--t3);cursor:default}

/* Cifras de cabecera */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--linea-fuerte);border-bottom:1px solid var(--linea);margin-bottom:88px}
.cifras>div{padding:24px 24px 28px 0}
.cifras>div+div{padding-left:24px;border-left:1px solid var(--linea)}
.rot{margin:0 0 14px;font-size:.87rem;color:var(--t3)}
.grande{margin:0;font-size:clamp(2.2rem,5.2vw,3.5rem);font-weight:200;letter-spacing:-.035em;line-height:1;color:var(--t1)}
.grande small{font-size:.42em;font-weight:300;letter-spacing:0;color:var(--t3);margin-left:.25em}
.sub{margin:14px 0 0;font-size:.87rem;color:var(--t3)}
.alerta{color:var(--alerta)}

/* Proveedor */
section{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px 56px;padding:40px 0 72px;border-top:1px solid var(--linea-fuerte)}
h2{margin:0 0 4px;font-size:1.35rem;font-weight:300;letter-spacing:-.015em;color:var(--t1)}
.estado{margin:0 0 28px;font-size:.87rem;color:var(--t3)}
.saldo{margin:0;font-size:2.4rem;font-weight:200;letter-spacing:-.03em;line-height:1.05;color:var(--t1)}
.saldo small{font-size:.45em;font-weight:300;letter-spacing:0;color:var(--t3);margin-left:.25em}
.medidor{margin-top:28px}
.medidor .pista{height:2px;background:var(--linea);position:relative}
.medidor .lleno{position:absolute;inset:0 auto 0 0;background:var(--t1)}
.medidor p{display:flex;justify-content:space-between;gap:12px;margin:10px 0 0;font-size:.82rem;color:var(--t3)}
.notas{margin:28px 0 0;padding:0;list-style:none;font-size:.82rem;color:var(--t3)}
.notas li+li{margin-top:8px}
.lado .panel{display:inline-block;margin-top:24px;font-size:.87rem}

h3{margin:0 0 20px;font-size:.87rem;font-weight:400;color:var(--t3);display:flex;justify-content:space-between;gap:16px}
h3 b{font-weight:400;color:var(--t1)}
.grafico{position:relative;margin-bottom:48px}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico .b{fill:var(--barra);transition:fill .2s ease-out}
.grafico .b.cero{fill:var(--barra-cero)}
.grafico .zona{fill:transparent}
.grafico .zona:hover+.b,.grafico g.on .b{fill:var(--t1)}
.grafico g.atenuado .b:not(.cero){fill:rgb(var(--tinta)/.3)}
.grafico text{fill:var(--t3);font-size:11px;font-variant-numeric:tabular-nums}
.grafico .base{stroke:var(--linea);stroke-width:1}
.ayuda{position:absolute;top:0;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
  background:var(--fondo);border:1px solid var(--linea-fuerte);padding:6px 10px;font-size:.82rem;color:var(--t2);opacity:0;transition:opacity .15s ease-out}
.ayuda.ver{opacity:1}
.ayuda b{font-weight:500;color:var(--t1)}
.vacio{margin:0 0 48px;padding:20px 0;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);font-size:.87rem;color:var(--t3)}

table{width:100%;border-collapse:collapse;font-size:.87rem}
th{font-weight:400;color:var(--t3);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--linea)}
td{padding:10px 0;border-bottom:1px solid var(--linea);color:var(--t2);vertical-align:baseline}
td:first-child{color:var(--t1);word-break:break-word;padding-right:16px}
th.d,td.d{text-align:right;white-space:nowrap;padding-left:16px}
td.peso{width:22%;padding-left:16px}
td.peso span{display:block;height:2px;background:var(--t1);min-width:1px}
.tabla{overflow-x:auto}

.cargando,.fallo{padding:40px 0;border-top:1px solid var(--linea-fuerte);font-size:.95rem;color:var(--t3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:820px){
  main{padding:32px 20px 80px}
  header{margin-bottom:36px}
  .cifras{grid-template-columns:1fr;margin-bottom:56px}
  .cifras>div{padding:20px 0}
  .cifras>div+div{padding-left:0;border-left:0;border-top:1px solid var(--linea)}
  section{grid-template-columns:1fr;gap:36px;padding:32px 0 56px}
  td.peso{display:none}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Crédito de APIs</h1>
    <div class="meta"><span id="hora" aria-live="polite"></span><button id="recargar" type="button">Actualizar</button></div>
  </header>
  <div id="app"><p class="cargando">Consultando a los proveedores…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = (x, dec = 2) => x == null ? '—' : x.toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const cifra = x => x == null ? '—' : `${dinero(x)}<small>$</small>`;
const fino = x => x == null ? '—' : dinero(x, x > 0 && x < 0.01 ? 4 : 2) + ' $';
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const diaCorto = iso => { const [, m, d] = iso.split('-').map(Number); return `${d} ${MESES[m - 1]}`; };
const cantidad = r => r.cantidad == null ? '' : `${r.cantidad.toLocaleString('es-ES', { maximumFractionDigits: 2 })} ${esc(r.unidad || '')}`;

function grafico(serie) {
  const W = 720, H = 150, pie = 22, n = serie.length, paso = W / n, ancho = Math.max(2, paso - 2);
  const max = Math.max(...serie.map(p => p.usd), 0.0001), alto = H - pie - 14;
  let g = '';
  serie.forEach((p, i) => {
    const h = p.usd > 0 ? Math.max(2, p.usd / max * alto) : 1, x = i * paso + 1, y = H - pie - h;
    g += `<g data-i="${i}"><rect class="zona" x="${i * paso}" y="0" width="${paso}" height="${H - pie}"/>` +
      `<rect class="b${p.usd > 0 ? '' : ' cero'}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${ancho.toFixed(2)}" height="${h.toFixed(2)}"/></g>`;
  });
  const marcas = [0, Math.floor(n / 2), n - 1].map((i, k) =>
    `<text x="${(i * paso + paso / 2).toFixed(1)}" y="${H - 4}" text-anchor="${['start', 'middle', 'end'][k]}">${diaCorto(serie[i].dia)}</text>`).join('');
  const total = serie.reduce((a, p) => a + p.usd, 0);
  const resumen = `Gasto por día. Total ${fino(total)}; día más alto ${fino(max > 0.0001 ? max : 0)}.`;
  return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(resumen)}">` +
    `<line class="base" x1="0" x2="${W}" y1="${H - pie + .5}" y2="${H - pie + .5}"/>${g}${marcas}</svg><div class="ayuda" role="status"></div></div>`;
}

function seccion(p, umbral, dias) {
  if (p.estado !== 'ok') {
    const que = p.estado === 'sin_clave' ? 'Sin clave configurada' : 'No ha respondido';
    return `<section><div class="lado"><h2>${esc(p.nombre)}</h2><p class="estado alerta">${que}</p></div>` +
      `<div><p class="vacio">${esc(p.error)}</p></div></section>`;
  }
  const bajo = p.saldo != null && p.saldo < umbral;
  let lado = `<h2>${esc(p.nombre)}</h2><p class="estado${bajo ? ' alerta' : ''}">${bajo ? `Saldo bajo: menos de ${dinero(umbral, 0)} $` : 'Conectado'}</p>`;
  lado += p.saldo == null ? `<p class="rot">Saldo disponible</p><p class="estado">No se puede leer por API</p>`
    : `<p class="rot">Saldo disponible</p><p class="saldo num${bajo ? ' alerta' : ''}">${cifra(p.saldo)}</p>`;
  if (p.limite != null) {
    const pct = Math.min(100, p.gastado_limite / p.limite * 100);
    lado += `<div class="medidor"><div class="pista" role="meter" aria-valuemin="0" aria-valuemax="${p.limite}" aria-valuenow="${p.gastado_limite}" aria-label="Límite de la clave"><div class="lleno" style="width:${pct.toFixed(1)}%"></div></div>` +
      `<p class="num"><span>Límite de la clave</span><span>${fino(p.gastado_limite)} de ${fino(p.limite)}</span></p></div>`;
  }
  if (p.notas.length) lado += `<ul class="notas">${p.notas.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
  if (p.panel) lado += `<a class="panel" href="${esc(p.panel)}" target="_blank" rel="noopener">Abrir su panel</a>`;

  let cuerpo = `<h3><span>Gasto por día, últimos ${dias} días</span><b class="num">${p.gasto_30d == null ? '' : fino(p.gasto_30d)}</b></h3>`;
  if (!p.serie) cuerpo += `<p class="vacio">Este proveedor no da el gasto por día con la clave actual.</p>`;
  else if (!p.gasto_30d) cuerpo += `<p class="vacio">Sin gasto en los últimos ${dias} días.</p>`;
  else cuerpo += grafico(p.serie);
  if (p.desglose.length) {
    const max = Math.max(...p.desglose.map(r => r.usd), 0.0001);
    cuerpo += `<div class="tabla"><table><tr><th>En qué se ha ido</th><th class="d">Cantidad</th><th></th><th class="d">Coste</th></tr>` +
      p.desglose.map(r => `<tr><td>${esc(r.nombre)}</td><td class="d num">${cantidad(r)}</td>` +
        `<td class="peso"><span style="width:${(r.usd / max * 100).toFixed(1)}%"></span></td><td class="d num">${fino(r.usd)}</td></tr>`).join('') + `</table></div>`;
  }
  return `<section data-id="${esc(p.id)}"><div class="lado">${lado}</div><div>${cuerpo}</div></section>`;
}

function pintar(d) {
  const ok = d.proveedores.filter(p => p.estado === 'ok');
  const conSaldo = ok.filter(p => p.saldo != null);
  const saldo = conSaldo.reduce((a, p) => a + p.saldo, 0);
  const conGasto = ok.filter(p => p.gasto_30d != null);
  const gasto = conGasto.reduce((a, p) => a + p.gasto_30d, 0);
  const menor = [...conSaldo].sort((a, b) => a.saldo - b.saldo)[0];
  const sinSaldo = ok.filter(p => p.saldo == null).map(p => p.nombre);
  const sinGasto = ok.filter(p => p.gasto_30d == null).map(p => p.nombre);
  const caidos = d.proveedores.filter(p => p.estado !== 'ok').map(p => p.nombre);
  const bajo = menor && menor.saldo < d.umbral_saldo_bajo;
  let html = `<div class="cifras">
    <div><p class="rot">Saldo disponible</p><p class="grande num">${conSaldo.length ? cifra(saldo) : '—'}</p>
      <p class="sub">${conSaldo.map(p => esc(p.nombre)).join(' y ') || 'Ningún proveedor lo publica'}${sinSaldo.length ? `. Sin dato: ${esc(sinSaldo.join(', '))}` : ''}</p></div>
    <div><p class="rot">Gasto, últimos ${d.dias} días</p><p class="grande num">${conGasto.length ? cifra(gasto) : '—'}</p>
      <p class="sub">${conGasto.map(p => esc(p.nombre)).join(' y ') || 'Sin datos'}${sinGasto.length ? `. Sin dato: ${esc(sinGasto.join(', '))}` : ''}</p></div>
    <div><p class="rot">Se acaba antes</p><p class="grande${bajo ? ' alerta' : ''}">${menor ? esc(menor.nombre) : '—'}</p>
      <p class="sub${bajo ? ' alerta' : ''}">${menor ? `Quedan ${fino(menor.saldo)}${bajo ? `, por debajo de ${dinero(d.umbral_saldo_bajo, 0)} $` : ''}` : ''}${caidos.length ? ` · Sin respuesta: ${esc(caidos.join(', '))}` : ''}</p></div>
  </div>`;
  html += d.proveedores.map(p => seccion(p, d.umbral_saldo_bajo, d.dias)).join('');
  $('#app').innerHTML = html;
  $('#hora').textContent = 'Actualizado ' + new Date(d.actualizado).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

  // Capa de detalle al pasar el ratón o tocar una barra
  d.proveedores.forEach(p => {
    const caja = $(`section[data-id="${p.id}"] .grafico`); if (!caja) return;
    const ayuda = $('.ayuda', caja), svg = $('svg', caja);
    const quitar = () => { ayuda.classList.remove('ver'); svg.querySelectorAll('g').forEach(g => g.classList.remove('on', 'atenuado')); };
    svg.addEventListener('pointermove', e => {
      const g = e.target.closest('g[data-i]'); if (!g) return quitar();
      const pt = p.serie[+g.dataset.i], r = g.querySelector('.b').getBoundingClientRect(), c = caja.getBoundingClientRect();
      svg.querySelectorAll('g').forEach(x => { x.classList.toggle('on', x === g); x.classList.toggle('atenuado', x !== g); });
      ayuda.innerHTML = `${diaCorto(pt.dia)} · <b class="num">${fino(pt.usd)}</b>`;
      ayuda.style.left = Math.min(c.width - 60, Math.max(60, r.left + r.width / 2 - c.left)) + 'px';
      ayuda.style.top = (r.top - c.top - 8) + 'px';
      ayuda.classList.add('ver');
    });
    svg.addEventListener('pointerleave', quitar);
  });
}

async function cargar(forzar) {
  const b = $('#recargar'); b.disabled = true; b.textContent = 'Actualizando…';
  try {
    const r = await fetch('/api/resumen' + (forzar ? '?forzar=1' : ''));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    pintar(await r.json());
  } catch (e) {
    $('#app').innerHTML = `<p class="fallo">No se ha podido leer /api/resumen (${esc(e.message)}). Comprueba que server.py sigue en marcha.</p>`;
  }
  b.disabled = false; b.textContent = 'Actualizar';
}
$('#recargar').addEventListener('click', () => cargar(true));
cargar(false);
setInterval(() => { if (!document.hidden) cargar(false); }, 5 * 60 * 1000);
</script>
</body>
</html>
